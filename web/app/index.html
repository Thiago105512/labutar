<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1b1446">
  <title>Labutar — Gestão de Pessoas e Mão de Obra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="marca" href="#/inicio">
        <span class="marca-logo" aria-hidden="true">
          <svg viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ffb547"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#lg)"/><path d="M10 8v16h12" fill="none" stroke="#1b1446" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="21" cy="11" r="3" fill="#1b1446"/></svg>
        </span>
        <span class="marca-texto">
          <strong>Labutar</strong>
          <small>Pessoas &amp; Mão de Obra</small>
        </span>
      </a>
      <nav class="menu" id="menu" aria-label="Módulos"></nav>
      <div class="sidebar-rodape">
        <div class="empresa">
          <span class="empresa-avatar" id="empresa-sigla"></span>
          <span class="empresa-texto">
            <strong id="empresa-nome"></strong>
            <small>Plano Profissional</small>
          </span>
        </div>
      </div>
    </aside>
    <div class="sidebar-fundo" id="sidebar-fundo"></div>

    <div class="principal">
      <header class="topo">
        <button class="botao-icone so-celular" id="abrir-menu" type="button" aria-label="Abrir menu"></button>
        <div class="topo-titulo">
          <span class="migalha" id="migalha">Recrutamento</span>
          <h1 id="titulo-pagina">Início</h1>
        </div>
        <label class="busca">
          <span id="icone-busca"></span>
          <input type="search" id="busca" placeholder="Buscar vagas, candidatos…" autocomplete="off">
        </label>
        <div class="topo-acoes">
          <button class="botao-icone" type="button" aria-label="Notificações" id="botao-sino"></button>
          <button class="botao botao-primario" type="button" id="botao-nova-vaga"></button>
          <button class="usuario usuario-botao" type="button" id="topo-usuario" data-minha-conta title="Minha conta"></button>
          <button class="botao-icone" type="button" id="botao-sair" data-sair aria-label="Sair" title="Sair"></button>
        </div>
      </header>

      <main class="conteudo" id="conteudo" tabindex="-1">
        <div class="carregando"><span class="spinner"></span>Carregando…</div>
      </main>
    </div>
  </div>

  <div class="tela-cheia" id="tela-cheia" hidden></div>

  <div class="painel-lateral" id="painel-lateral" aria-hidden="true">
    <div class="painel-fundo" data-fechar></div>
    <aside class="painel" role="dialog" aria-modal="true" id="painel"></aside>
  </div>

  <div class="avisos" id="avisos" aria-live="polite"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
